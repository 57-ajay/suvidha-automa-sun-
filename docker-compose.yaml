services:
  redis:
    image: redis:7-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  api:
    build: ./api
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - default
      - proxy

  worker:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3000
      - DOMAIN=${DOMAIN}
      - MAX_SLOTS=${MAX_SLOTS:-10}
      - SCRIPTED_BORDER_TAX_STATES=${SCRIPTED_BORDER_TAX_STATES:-}
      - WEB_HANDOVER_POLL_QR=${WEB_HANDOVER_POLL_QR}
      - SCRIPTED_BORDER_TAX_AUTO_CLEAR_PENDING=${SCRIPTED_BORDER_TAX_AUTO_CLEAR_PENDING:-false}
    depends_on:
      - redis
      - api
    shm_size: "4gb"
    tmpfs:
      - /tmp:size=3g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - default
      - proxy

