services:
  oredis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  oapi:
    build: ./api
    environment:
      - REDIS_URL=redis://oredis:6379
    depends_on:
      - oredis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      default:
      proxy:
        aliases:
          - oapi
        

  oworker:
    build: ./worker
    init: true
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://oredis:6379
      - API_URL=http://oapi:3000
      - DOMAIN=${DOMAIN}
      - MAX_SLOTS=${MAX_SLOTS:-10}
      - SCRIPTED_BORDER_TAX_STATES=${SCRIPTED_BORDER_TAX_STATES:-}
      - WEB_HANDOVER_POLL_QR=${WEB_HANDOVER_POLL_QR}
      - SCRIPTED_BORDER_TAX_AUTO_CLEAR_PENDING=${SCRIPTED_BORDER_TAX_AUTO_CLEAR_PENDING:-false}
      - TIMEOUT_BrowserLaunchEvent=${TIMEOUT_BrowserLaunchEvent:-60}
      - TIMEOUT_BrowserStartEvent=${TIMEOUT_BrowserStartEvent:-90}
    depends_on:
      - oredis
      - oapi
    shm_size: "4gb"
    tmpfs:
      - /tmp:size=3g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      default:
      proxy:
        aliases:
          - oworker

networks:
  proxy:
    external: true
    name: proxy-old
